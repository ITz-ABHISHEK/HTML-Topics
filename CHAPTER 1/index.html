<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Food felivery at your doorstep</title>
   <style>/* Reset some default styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fff;
    color: #333;
}

/* Header styles */
header {
    background-color: #DC143C; /* Crimson Red */
    color: #fff;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 1.8rem;
    font-weight: bold;
}

nav a {
    color: #fff;
    text-decoration: none;
    margin-left: 20px;
    font-weight: 500;
    transition: color 0.3s;
}

nav a:hover {
    color: #ffcccc;
}

/* Main content */
main {
    padding: 2rem;
    font-size: 1.2rem;
    line-height: 1.6;
}

/* Footer styles */
footer {
    background-color: #f2f2f2;
    color: #555;
    text-align: center;
    padding: 1rem;
    margin-top: 2rem;
    font-size: 0.9rem;
}
</style>
</head>
<body>
    <header>
        <div>Zomato</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Cart</a>
            <nav>
    </header>
    <main> 
        <p>For over a decade, we’ve enabled our customers to discover new tastes, delivered right to their doorstep</p>

    </main>
    <footer>
        <p>Copyright @ 2024 Zomato</p>
    </footer>
</body>
</html>
